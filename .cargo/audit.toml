# Advisories this crate cannot act on, and why each one is safe to
# carry rather than quietly ignored.
#
# `cargo audit` reads `Cargo.lock`, which lists every package the
# resolver considered. A package in the lockfile is not necessarily a
# package that gets compiled. Each entry names what would have to change
# for it to come out, so this file stays a decision rather than a habit.
#
# This file governs THIS repository's own audit. It is not published
# with the crate and does not travel to anyone who depends on it: a
# consumer running `cargo audit` sees the advisory and makes their own
# call, which is the right way round.
#
# The move to surrealdb 4.0 retired three entries: RUSTSEC-2026-0235
# (rkyv, now 0.8.18 in the lockfile) and RUSTSEC-2026-0194 / -0195
# (quick-xml, now 0.41 through object_store 0.14).

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa: Marvin timing sidechannel) has no fixed
    # release. It reaches the lockfile through the engine's JWT stack,
    # `jsonwebtoken -> surrealdb-core -> surrealdb`, and is compiled.
    # The attack times an in-process RSA private-key operation; this
    # crate performs none, and the record-access path it added
    # verifies tokens rather than signing them. Re-evaluate whenever
    # surrealdb or jsonwebtoken move off the unfixed crate.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0387 (crypto-bigint 0.5.5: timing variability in
    # operations meant to be constant-time) is fixed only in 0.7.6. It
    # reaches the lockfile through the engine's JWT stack,
    # `jsonwebtoken 10.4 -> p256 0.13 -> elliptic-curve 0.13 ->
    # crypto-bigint 0.5`, and elliptic-curve 0.13 cannot take 0.7, so
    # no bump clears it; main carries it too. The leak needs secret
    # P-256 scalar operations to time. SurrealDB uses p256 only for an
    # access method configured with an ES algorithm, and this crate
    # defines none. Drop this when surrealdb or jsonwebtoken moves to
    # elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
]
